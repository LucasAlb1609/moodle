<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Moodle :: Questionário</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-KK94CHFLLe+nY2dmCWGMq91rCGa5gtU4mk92HdvYe+M/SXH301p5ILy+dN9+nJOZ" crossorigin="anonymous">
    <link href="css/questionario.css" rel="stylesheet">
</head>
<body class="text-primary">
    <header>
        <div class="container">
            <div class="row">
                <div class="col-12">
                    <h1>Preparação de Questionário para Importação no Moodle via GIFT</h1>
                </div>
            </div>
        </div>
    </header>
    <main>
        <div class="container">
            <div class="row">
                <section class="col-6">
                    <label>Rótulo</label>
                    <Select id="competencia">
                        <option value="1">Atividade Semanal 01 (AS01)</option>
                        <option value="2">Aula Atividade 01 (AA01)</option>
                        <option value="3">Atividade Semanal 02 (AS02)</option>
                        <option value="4">Aula Atividade 02 (AA02)</option>
                        <option value="5">Atividade Semanal 03 (AS03)</option>
                        <option value="6">Aula Atividade 03 (AA03)</option>
                        <option value="7">Atividade Semanal 04 (AS04)</option>
                        <option value="8">Aula Atividade 04 (AA04)</option>
                        <option value="9">Atividade Semanal 05 (AS05)</option>
                        <option value="10">Aula Atividade 05 (AA05)</option>
                        <option value="av">Avaliação da Disciplina (AV)</option>
                        <option value="noa">Novas Oportunidades de Aprendizagem (NOA)</option>
                    </Select>
                </section>
                <section class="col-6 d-flex align-items-end">
                    <div class="form-check mb-2">
                        <input class="form-check-input" type="checkbox" id="estilizar">
                        <label class="form-check-label fw-bold" for="estilizar">
                            Exportar como Moodle XML estilizado (CSS Moove)
                        </label>
                    </div>
                </section>
            </div>
            <div class="row">
                <section class="col-6">
                    <label>Entrada</label>
                    <textarea id="entrada"></textarea>
                </section>
                <section class="col-6">
                   <label>Saída</label>
                    <textarea id="saida" readonly></textarea>
                </section>
            </div>
            <div class="row">
                <section class="text-center">
                    <button id="processar" class="btn btn-primary">Processar</button>
                    <button id="copiar" class="btn btn-primary">Copiar</button>
                    <button id="baixar" class="btn btn-primary">Baixar</button>
                </section>
                <section class="text-center">
                    <button id="ajuda" class="btn btn-warning">Ajuda</button>
                    <button id="limpar" class="btn btn-danger">Limpar</button>
                    <button id="mais-ferramentas" class="btn btn-warning">Mais Ferramentas</button>
                </section>
            </div>
            <div class="row mais-ferramentas">
                <section class="col-6 localizar-e-substituir">
                    <label>Localizar e Substituir</label>
                    <input type="text" placeholder="Localizar"></input>
                    <input type="text" placeholder="Substituir"></input>
                    <button class='btn btn-primary'>Executar</button>
                </section>
            </div>
        </div>
    </main>
    <footer>
        <div class="container">
            <div class="row">
                <section>
                    <p>Desenvolvido por Joelson Alves, José Eilton e Jailson Miranda (servidores lotados na Escola Técnica Estadual Professor Antônio Carlos Gomes da Costa).</p>
                </section>
            </div>
        </div>
    </footer>
    <script src="js/questionario.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.7/dist/umd/popper.min.js" integrity="sha384-zYPOMqeu1DAVkHiLqWBUTcbYfZ8osu1Nd6Z89ify25QV9guujx43ITvfi12/QExE" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/js/bootstrap.min.js" integrity="sha384-Y4oOpwW3duJdCWv5ly8SCFYWqFDsfob/3GkgExXKV4idmbt98QcxXYs9UoXAB7BZ" crossorigin="anonymous"></script>
</body>
</html>
